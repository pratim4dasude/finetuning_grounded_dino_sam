[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finetuning"
version = "0.1.0"
description = "SAM and Grounding DINO finetuning CLI"
authors = [{name = "Pratim Dasude"}]
readme = "README.md"
requires-python = ">=3.9"

license = {text = "MIT"}
keywords = ["computer vision", "segmentation", "detection", "sam", "grounding dino"]

dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "tqdm",
    "Pillow",
    "numpy",
    "scipy",
    "pycocotools"
]

[project.scripts]
finetune = "finetuning.cli:main"